<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shooter Prototype</title>
<link rel="stylesheet" href="./shop.css">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0b1020; height: 100%; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; font: 700 16px/1 system-ui, sans-serif;
  }
  #hud .left, #hud .right {
    background: rgba(0,0,0,0.4); padding: 8px 14px; border-radius: 10px;
    backdrop-filter: blur(6px);
  }
  #hud button {
    background: #1a2340; color: #e6eefc; border: none;
    padding: 8px 14px; border-radius: 10px; font-weight: 700;
    cursor: pointer; margin-left: 8px;
  }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #9fb4d8; font: 500 13px/1.3 system-ui, sans-serif;
    background: rgba(0,0,0,0.35); padding: 8px 14px; border-radius: 10px;
    text-align: center; pointer-events: none;
  }
</style>
</head>
<body>
<div id="hud">
  <div class="left">Счёт: <span id="score">0</span></div>
  <div class="right">
    🪙 <span id="coins">0</span>
    <button id="btn-shop">Магазин</button>
  </div>
</div>
<div id="hint">Тяни — двигай куб · Тап — выстрел</div>
<div id="shop" style="display:none"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
